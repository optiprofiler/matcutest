name: CI

on:
  push:
  pull_request:
  schedule:
    # 07:00 Beijing time.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OptiProfiler
        uses: actions/checkout@v4
        with:
          repository: optiprofiler/optiprofiler
          path: optiprofiler
          ref: main

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a

      - name: Install MatCUTEst and run adapter tests
        uses: matlab-actions/run-command@v2
        with:
          command: "addpath(pwd); receipt = matcutest_setup(pwd); addpath(receipt.runtime_paths{:}); run('tests/smoke_matcutest.m'); addpath('tests'); test_constraint_counts; test_runtime_setup(pwd); test_real_constraints; test_bound_oracles(fullfile(getenv('RUNNER_TEMP'), 'matcutest-bound-oracles.mat')); second = matcutest_setup(fullfile(getenv('RUNNER_TEMP'), 'second-runtime')); test_bound_runtime_roots({receipt.runtime_root, second.runtime_root}, fullfile(getenv('RUNNER_TEMP'), 'matcutest-bound-roots.mat'));"

      - name: Reload bound Problems in a fresh MATLAB session
        uses: matlab-actions/run-command@v2
        with:
          command: "addpath(pwd, fullfile(pwd, 'tests'), fullfile(pwd, 'optiprofiler', 'matlab', 'optiprofiler', 'src')); test_bound_oracles(fullfile(getenv('RUNNER_TEMP'), 'matcutest-bound-oracles.mat'), true); test_bound_runtime_roots({}, fullfile(getenv('RUNNER_TEMP'), 'matcutest-bound-roots.mat'), true);"
